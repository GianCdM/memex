[project]
name = "memex"
version = "0.0.1"
description = "A portable, local-first second brain built from your AI coding sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GianCdM" }]
keywords = ["second-brain", "llm", "wiki", "obsidian", "knowledge-management", "ai", "memex"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
# Core is stdlib-only — zero runtime dependencies.
dependencies = []

[project.scripts]
memex = "memex.cli:main"

[project.urls]
Homepage = "https://github.com/GianCdM/memex"
Repository = "https://github.com/GianCdM/memex"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memex"]
