[project]
name = "memex"
version = "1.2.0"
description = "A portable, local-first second brain built from your AI sessions — management, architecture and coding alike."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GianCdM" }]
keywords = ["second-brain", "llm", "wiki", "obsidian", "knowledge-management", "ai", "memex"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
# Core is stdlib-only — zero runtime dependencies.
dependencies = []

[project.scripts]
memex = "memex.cli:main"

[project.urls]
Homepage = "https://github.com/GianCdM/memex"
Repository = "https://github.com/GianCdM/memex"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memex"]

[tool.semantic_release]
# Source of truth: pyproject.toml [project] version. Tag = the release point;
# no GitHub "Release" page (that's the separate `publish` step, which we skip).
commit_message = "chore(release): v{version} [skip ci]"
tag_format = "v{version}"
changelog_file = "CHANGELOG.md"
build_command = ""
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.branch.main]
match = "main"

# No GitHub Release page — just tag + changelog. Default true would hit the
# releases API (401 with the CI token) and publish a page we don't want.
[tool.semantic_release.publish]
upload_to_vcs_release = false
