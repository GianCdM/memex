name: "Semantic Release (tag + changelog)"

# A cada push na main: lê os conventional commits desde a última tag,
# calcula o próximo semver (fix→PATCH, feat→MINOR, BREAKING→MAJOR),
# bumpeia pyproject.toml + regenera CHANGELOG.md, commita [skip ci] e
# cria a tag vX.Y.Z. NÃO cria GitHub Release (só tag + changelog).

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # não re-dispara quando o próprio bump commita ([skip ci] no título)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # histórico completo + tags (semantic-release precisa)
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install python-semantic-release
        # Pin GitPython below 3.1.60: that release removed Actor.name_email_regex,
        # which python-semantic-release 10.x still references at config-validation
        # time (broke the bump with `type object 'Actor' has no attribute
        # 'name_email_regex'` on 2026-08-27).
        run: pip install --quiet "python-semantic-release" "gitpython<3.1.60"
      - name: Version (tag + changelog + bump pyproject)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --no-vcs-release: nunca chamar o endpoint de GitHub Release. Só tag +
        # changelog (o GITHUB_TOKEN de CI não tem escopo pra POST /releases e o
        # repo não quer release page; upload_to_vcs_release=false no pyproject
        # não é suficiente na versão atual do tool).
        run: semantic-release version --no-vcs-release